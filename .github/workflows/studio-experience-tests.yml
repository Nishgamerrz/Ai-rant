name: Validate Roblox short generator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workflow parser
        run: python -m pip install PyYAML reportlab

      - name: Set up Node for renderer and Rapier physics checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/video_renderer/package-lock.json

      - name: Install renderer dependencies and smoke-test physics
        working-directory: tools/video_renderer
        run: |
          npm ci --no-audit --no-fund
          npm run test:physics

      - name: Compile Python and run experience tests
        run: |
          python -m py_compile tools/*.py tests/*.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Validate Three.js renderer and embedded browser module syntax
        run: |
          node --check tools/video_renderer/render_short.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('tools/video_renderer/render_short.mjs').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('renderer HTML module was not found')
          module = (match.group(1).replace('${WIDTH}', '720').replace('${HEIGHT}', '1280')
                   .replace('${FPS}', '30'))
          Path('/tmp/renderer-module-check.mjs').write_text(module, encoding='utf-8')
          PY
          node --check /tmp/renderer-module-check.mjs

      - name: Validate workflow YAML and embedded Bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          for workflow_path in Path('.github/workflows').glob('*.yml'):
              workflow = yaml.safe_load(workflow_path.read_text(encoding='utf-8'))
              for job in workflow.get('jobs', {}).values():
                  for index, step in enumerate(job.get('steps', [])):
                      script = step.get('run')
                      if not script:
                          continue
                      result = subprocess.run(['bash', '-n'], input=script, text=True,
                                              capture_output=True, check=False)
                      if result.returncode:
                          raise SystemExit(f'{workflow_path}: step {step.get("name", index)}: {result.stderr}')
          print('Workflow YAML and embedded Bash syntax passed.')
          PY
