          echo "NARRATOR_RATE=$RATE" >> "$GITHUB_ENV"
          NARRATION_SECONDS=$(python -c "from mutagen.mp3 import MP3; print(f'{MP3(\"dist/narration.mp3\").info.length:.2f}')")
          echo "NARRATION_SECONDS=$NARRATION_SECONDS" >> "$GITHUB_ENV"
          maximum=$(( DURATION_SECONDS + 1 ))
          # The measurement happens inside this step, so NARRATOR_RATE is not in the
          # environment yet (GITHUB_ENV only reaches later steps) - read $RATE instead.
          python tools/say.py plan "Voiceover: ${NARRATION_SECONDS}s of the ${DURATION_SECONDS}s video (rate ${RATE})."
          # If the script came out short, speak the same words a little slower rather
          # than leaving silence: one retry, capped at -20% so it still sounds like a
          # story short and never like an audiobook. Measured, then kept only if closer.
          if python -c "import sys; sys.exit(0 if $NARRATION_SECONDS < $DURATION_SECONDS * 0.9 else 1)"; then
            # Speaking MORE SLOWLY makes the audio longer, so a short take needs a
            # negative rate. The first version of this divided the wrong way round
            # and asked for "+0%", which changed nothing: run #84 kept a 74-second
            # voiceover in a 128-second video.
            FILL_RATE=$(python -c "
          seconds=max(0.1, float('$NARRATION_SECONDS')); target=float('$DURATION_SECONDS')
          percent=round((seconds / target - 1) * 100)
          percent=max(-20, min(4, percent))
          print(('+' if percent >= 0 else '') + str(percent) + '%')")
            python tools/say.py warning "The narration is ${NARRATION_SECONDS}s for a ${DURATION_SECONDS}s video; speaking it once more at ${FILL_RATE} to fill the length."
            cp dist/narration.mp3 dist/narration_first_take.mp3
            cp dist/narration.srt dist/narration_first_take.srt
            if edge-tts --voice "$VOICE" --rate="$FILL_RATE" --pitch="$PITCH" \
              --file dist/narration.txt --write-media dist/narration.mp3 \
              --write-subtitles dist/narration.srt && [ -s dist/narration.mp3 ]; then
              FILLED=$(python -c "from mutagen.mp3 import MP3; print(f'{MP3(\"dist/narration.mp3\").info.length:.2f}')")
              if python -c "import sys; sys.exit(0 if abs($FILLED - $DURATION_SECONDS) < abs($NARRATION_SECONDS - $DURATION_SECONDS) else 1)"; then
                NARRATION_SECONDS=$FILLED
                RATE="$FILL_RATE"
                echo "NARRATION_SECONDS=$NARRATION_SECONDS" >> "$GITHUB_ENV"
                echo "NARRATOR_RATE=$FILL_RATE" >> "$GITHUB_ENV"
                python tools/say.py success "Filled the length: the voiceover is now ${NARRATION_SECONDS}s at ${FILL_RATE}."
              else
                cp dist/narration_first_take.mp3 dist/narration.mp3
                cp dist/narration_first_take.srt dist/narration.srt
                python tools/say.py warning "The slower read did not fit any better, so the first take stands."
              fi
            else
              cp dist/narration_first_take.mp3 dist/narration.mp3
              cp dist/narration_first_take.srt dist/narration.srt
            fi
          fi
          python - <<'PY'
          from mutagen.mp3 import MP3
          import os
          seconds = MP3('dist/narration.mp3').info.length
          maximum = int(os.environ['DURATION_SECONDS']) + 1
          target = int(os.environ['DURATION_SECONDS'])
          print(f'Selected voiceover duration: {seconds:.1f} seconds (short limit {maximum}s, target {target}s)')
          if not 5 <= seconds <= maximum:
              raise SystemExit('Voiceover duration is empty or exceeds the selected short length.')
          if seconds < target * 0.9:
              # Still short after the fill pass: say how much dead air there is, and
              # which rate was actually used (the old message printed an empty one).
              print(f'Warning: the narration ends {target - seconds:.1f}s before the video does at '
                    f'{os.environ.get("NARRATOR_RATE") or os.environ.get("RATE") or "the selected rate"}.')
          PY

      - name: Package the runnable Roblox Studio experience
        id: studio-experience
        env:
          # Used only to name the artifact and branch the stills summary mentions,
          # so two comparison runs stay apart.
          MODEL_QUALITY: ${{ inputs.model_quality || 'default' }}
        run: |
          python tools/build_studio_experience.py \
            --map dist/Roblox_Story_Map.json \
            --cast dist/characters.json \
            --avatar-profiles dist/avatar_profiles.json \
            --duration "$DURATION_SECONDS" \
            --narration dist/narration.txt \
            --srt dist/narration.srt \
            --output dist/Roblox_Studio_Experience.rbxlx \
            --lua-output dist/Generated_Story_World.lua \
            --readme dist/README_Studio.md
          test -s dist/Roblox_Studio_Experience.rbxlx
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('dist/Roblox_Studio_Experience.rbxlx').getroot()
          classes = [node.get('class') for node in root.iter('Item')]
          assert 'ServerScriptService' in classes and 'StarterPlayerScripts' in classes
          assert 'Script' in classes and 'LocalScript' in classes
          assert classes.count('Part') >= len(__import__('json').load(open('dist/Roblox_Story_Map.json'))['props']) + 1, f"expected all map parts plus foundation, got {classes.count('Part')} Parts"
          assert len((root.find('.//Item[@class="Script"]/Properties/ProtectedString')).text) > 1000
          client = root.find('.//Item[@class="LocalScript"]/Properties/ProtectedString').text
          assert len(client) > 1000
          assert 'NarrationCaption' not in client and 'TextLabel' not in client
          assert 'humanoid.DisplayDistanceType = Enum.HumanoidDisplayDistanceType.None' in root.find('.//Item[@class="Script"]/Properties/ProtectedString').text
          assert 'narrationSound.TimePosition' in client
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from build_studio_experience import parse_srt
          assert parse_srt(Path('dist/narration.srt')), 'generated SRT contains no usable timed caption cues'
          print(f'Validated Studio XML, {classes.count("Part")} editable Parts, scripts, and overlay-free camera and narration playback.')
          PY
          {
            echo "## Roblox short video and optional Studio project ready"
            echo "- Place: \`Roblox_Studio_Experience.rbxlx\`"
            echo "- The Studio place opens with a fully furnished, editable world containing $(python -c 'import json; print(len(json.load(open("dist/Roblox_Story_Map.json"))["props"]))') theme-matched Parts, generated from an AI landmark plan or a story-based fallback."
            echo "- World planning source: $(cat dist/map_source.txt); no fixed 100-Part cap, and the world includes the authentic-avatar cast, narration audio, and an overlay-free AI camera tour."
            echo "- A vertical H.264/AAC MP4 is rendered automatically in the Linux workflow with headless Three.js and FFmpeg; no local Roblox Studio or Blender run is needed."
            echo "- The AI plans and times every facial expression; the renderer animates a mouth that follows the narration and cuts to face close-ups like a Roblox story short."
            echo "- The renderer measured its own frames before shipping: see the \`Projection probe\` and \`Frame audit\` lines in the render step, which fail the run on a stretched or black world."
            echo "- Small PNG stills of that same footage are in the \`short-preview-stills-${MODEL_QUALITY}\` artifact, and on the [media-preview-${MODEL_QUALITY} branch](https://github.com/$GITHUB_REPOSITORY/tree/media-preview-${MODEL_QUALITY}), so the look can be checked without downloading the MP4."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free model RAM for the physics renderer
        env:
          SELECTED_AI_MODEL: ${{ env.AI_MODEL }}
        run: |
          if ollama stop "$SELECTED_AI_MODEL"; then
            python tools/say.py plan "Unloaded $SELECTED_AI_MODEL from memory before Chromium/Rapier rendering; cached model files remain on disk for the final summary."
          else
            python tools/say.py warning "Ollama could not unload the model cleanly; continuing with the render."
          fi

      - name: Render the complete vertical MP4 without Roblox Studio or Blender
        run: |
          node tools/video_renderer/render_short.mjs \
            --map dist/Roblox_Story_Map.json \
            --characters dist/characters.json \
            --profiles dist/avatar_profiles.json \
            --duration "$DURATION_SECONDS" \
            --captions dist/narration.srt \
            --face-animation always \
            --preview dist/preview \
            --output dist/short_silent.mp4
          test -s dist/short_silent.mp4
          ffmpeg -hide_banner -y -i dist/short_silent.mp4 -i dist/narration.mp3 \
            -filter_complex "[1:a]apad=whole_dur=${DURATION_SECONDS},atrim=duration=${DURATION_SECONDS},loudnorm=I=-16:TP=-1.5:LRA=11[a]" \
            -map 0:v:0 -map '[a]' -c:v copy -aspect 9:16 -c:a aac -b:a 192k -t "$DURATION_SECONDS" \
            -movflags +faststart dist/Roblox_2K_YouTube_Short.mp4
          python tools/validate_short.py \
            --video dist/Roblox_2K_YouTube_Short.mp4 \
            --silent-video dist/short_silent.mp4 \
            --narration dist/narration.txt \
            --captions dist/narration.srt \
            --characters dist/characters.json \
            --profiles dist/avatar_profiles.json \
            --map-plan dist/Roblox_Story_Map.json \
            --duration "$DURATION_SECONDS"

      - name: Upload the still previews so the look can be checked in seconds
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # One name per model preset: two test runs of the same workflow (the
          # hard vs smart_11b comparison, for example) must not collide.
          name: short-preview-stills-${{ inputs.model_quality || 'default' }}
          path: dist/preview/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native Studio project even if the MP4 cannot use a protected mesh
        if: failure() && steps.studio-experience.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Studio-Native-Animation-Project
          path: |
            dist/Roblox_Studio_Experience.rbxlx
            dist/Generated_Story_World.lua
            dist/README_Studio.md
            dist/avatar_profiles.json
            dist/avatar-assets/source-rbxm/*.rbxm
          if-no-files-found: error
          retention-days: 14

      - name: Write AI-generated creation summary and bundle the final deliverables
        env:
          VOICE_STYLE: ${{ inputs.voice_style }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          plan = json.loads(Path('dist/Roblox_Story_Map.json').read_text(encoding='utf-8'))
          cast = json.loads(Path('dist/characters.json').read_text(encoding='utf-8'))
          narration = Path('dist/narration.txt').read_text(encoding='utf-8')
          context = {
              'story': narration,
              'world_name': plan.get('name'),
              'user_theme': plan.get('theme'),
              'world_part_count': len(plan.get('props', [])),
              'world_plan_source': Path('dist/map_source.txt').read_text(encoding='utf-8').strip(),
              'representative_part_names': [p.get('name') for p in plan.get('props', [])[:60]],
              'camera_shot_count': len(plan.get('camera_shots', [])),
              'face_expression_beats': len(plan.get('face_expressions', [])),
              'face_closeup_shots': sum(1 for shot in plan.get('camera_shots', []) if str(shot.get('framing', '')).lower() == 'face'),
              'cast_usernames': cast,
              'duration_seconds': int(__import__('os').environ['DURATION_SECONDS']),
              'rendered_video': 'Roblox_2K_YouTube_Short.mp4',
              'video_resolution': '1440x2560 at 30 fps',
              'rendering_requires_local_studio': False,
          }
          prompt = (
              'Write a concise, friendly 100–160 word final creation summary for the user. '
              'Summarize only the completed story, world theme, furnishing, real Roblox avatars, AI-timed animated faces and face close-up cameras, narration audio, the on-screen narration captions and the rendered MP4 deliverables in this data. '
              'Do not reveal or imitate private chain-of-thought. Do not claim Roblox Studio runtime testing. '
              'Do not invent features not present in the data. Return only JSON with a summary string.\nDATA: '
              + json.dumps(context, ensure_ascii=False)
          )
          Path('creation_summary_prompt.txt').write_text(prompt, encoding='utf-8')
          PY
          jq -n --arg model "$AI_MODEL" --argjson think "$OLLAMA_THINKING" --rawfile prompt creation_summary_prompt.txt \
            '{model:$model, messages:[{role:"user",content:$prompt}], format:{type:"object",properties:{summary:{type:"string"}},required:["summary"],additionalProperties:false}, think:$think, stream:false, keep_alive:"60m", options:{temperature:2.0, top_p:0.99, num_ctx:8192, num_predict:900}}' > creation_summary_request.json
          python tools/ollama_stream.py --request creation_summary_request.json \
            --output creation_summary_response.json --label "creation summary" \
            --timeout 3600 --stall-seconds "${AI_STALL:-900}" \
            --fallback-model "${AI_FALLBACK_MODEL:-qwen3:8b}"
          python - <<'PY'
          from pathlib import Path
          import json
          payload = json.loads(Path('creation_summary_response.json').read_text(encoding='utf-8'))
          try:
              result = json.loads((payload.get('message') or {}).get('content', payload.get('response', '{}')))
          except (json.JSONDecodeError, TypeError):
              result = {}
          summary = result.get('summary', '') if isinstance(result, dict) else ''
          if not isinstance(summary, str) or len(summary.split()) < 20:
              raise SystemExit('The selected AI model did not return a usable creation summary.')
          Path('dist/AI_Creation_Summary.txt').write_text(summary.strip() + '\n', encoding='utf-8')
          print(f"AI creation summary generated ({len(summary.split())} words).")
          PY
          mkdir -p dist/Generation_Prompts
          cp narration_prompt.txt map_prompt.txt creation_summary_prompt.txt dist/Generation_Prompts/
          PACKAGE_RATE="${NARRATOR_RATE:-+4%}"
          python tools/say.py plan "Report speech-rate metadata: $PACKAGE_RATE"
          python tools/package_studio_deliverables.py \
            --directory dist \
            --map dist/Roblox_Story_Map.json \
            --cast dist/characters.json \
            --research dist/web_research.json \
            --summary dist/AI_Creation_Summary.txt \
            --model "$AI_MODEL" \
            --voice "$NARRATOR_VOICE" \
            --rate="$PACKAGE_RATE" \
            --duration "$DURATION_SECONDS"
          test -s dist/AI_Design_and_Tools_Report.pdf
          test -s dist/Roblox_Studio_Complete_Package.zip
          {
            echo "## Final ZIP bundle"
            echo "- Includes the rendered vertical MP4, editable place, map/story/cast and real avatar data, narration/audio captions, prompts, AI creation summary, and tools/design PDF."
            echo "- The PDF documents the high-level design and tools (not private chain-of-thought); the video passed the MP4 quality gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Roblox Studio project and narration assets
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Story-Short-MP4
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Record a repair task if short or project validation fails
        if: failure()
        run: |
          {
            echo '## Roblox short generation needs a repair pass'
            echo
            echo '- The MP4, avatar, narration, Studio project, or ZIP/PDF failed to build or validate, so no complete short package was uploaded.'
            echo '- Review the first failed step above, fix that issue, then rerun this workflow.'
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  # The finished MP4 is ~150 MB, and GitHub's artifact download refuses to open in
  # some browsers. This job copies the small still previews the renderer already
  # wrote onto a standing `media-preview` branch, so the look of a run can be
  # checked (and shared) in one click instead of downloading a whole video.
  # It never affects the result of the run: every step is allowed to fail.
  publish_preview:
    needs: generate_roblox_short
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the still previews
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: short-preview-stills-${{ inputs.model_quality || 'default' }}
          path: preview

      - name: Publish them to the media-preview branch
        continue-on-error: true
        run: |
          if [ ! -d preview ]; then
            echo "No still previews were produced, so there is nothing to publish."
            exit 0
          fi
          ls -la preview
          WORK=$(mktemp -d)
          cd "$WORK"
          # A branch per model preset, so the hard run and the smart_11b run of a
          # comparison test never overwrite each other's stills.
          BRANCH="media-preview-${{ inputs.model_quality || 'default' }}"
          git init -q -b "$BRANCH" .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp "$GITHUB_WORKSPACE"/preview/*.png . 2>/dev/null || true
          {
            echo "# Still previews"
            echo
            echo "Frames written by the renderer for [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo "These are the same frames the colour audit measured, so they show what the MP4 shows."
            echo
            for file in frame_*.png; do
              [ -e "$file" ] || continue
              echo "## $file"
              echo
              echo "![${file}](${file})"
              echo
            done
          } > README.md
          git add -A
          git commit -q -m "Still previews for run $GITHUB_RUN_ID" || exit 0
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "Published the stills to the ${BRANCH} branch."
