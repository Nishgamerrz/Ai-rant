name: Compile Fully Automated High-Res Roblox Short
on:
  workflow_dispatch:
    inputs:
      story_topic:
        description: 'Topic for the Roblox Short'
        required: true
        default: 'Telling a hacker his gaming chair is just too good'

jobs:
  generate_and_render_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup System Video Encoding (FFmpeg)
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Configure Python Infrastructure
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Graphic and Voice Processing Dependencies
        run: |
          pip install pillow numpy gTTS mutagen
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Launch Local AI Brain
        run: |
          curl -fsSL https://ollama.com | sh
          ollama serve &
          sleep 10
          ollama pull deepseek-r1:1.5b

      - name: Generate Story Layout Matrix
        id: ai_generation
        run: |
          PROMPT="You are a professional Roblox animation system. 
          Generate a 3-scene sequence layout for a short vertical video about: '\${{ github.event.inputs.story_topic }}'.
          Keep text content short (3-6 words per scene).
          Output STRICTLY a raw JSON object (no markdown, no explanations). The JSON must match this structure exactly:
          {
            \"scenes\": [
              {
                \"scene_num\": 1, 
                \"text\": \"Bro look at his chair\", 
                \"bg_color\":,
                \"facial_sequence\": [\"blink\", \"talk_open\", \"talk_closed\", \"talk_open\"]
              },
              {
                \"scene_num\": 2, 
                \"text\": \"He is literally flying\", 
                \"bg_color\":,
                \"facial_sequence\": [\"talk_open\", \"talk_closed\", \"shocked\", \"talk_open\"]
              },
              {
                \"scene_num\": 3, 
                \"text\": \"Bro is built different\", 
                \"bg_color\":,
                \"facial_sequence\": [\"smile\", \"talk_open\", \"talk_closed\", \"smile\"]
              }
            ]
          }"
          ollama run deepseek-r1:1.5b "\$PROMPT" > structural_data.json
          sed -i '/```/d' structural_data.json
          cat structural_data.json

      - name: Programmatically Render HD Frames with Border Subtitles
        run: |
          cat << 'EOF' > render_engine.py
          import json
          import os
          import math
          from PIL import Image, ImageDraw, ImageFont

          # Load the AI scene configuration data
          with open('structural_data.json', 'r') as f:
              data = json.load(f)

          # High Resolution Full 9:16 HD Layout
          width, height = 1080, 1920
          fps = 30
          os.makedirs('frames', exist_ok=True)
          os.makedirs('audio_clips', exist_ok=True)
          
          frame_count = 0
          audio_merge_list = []

          # Fallback structural font setup for clean scaling
          font_size = 85
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", font_size)
          except:
              font = ImageFont.load_default()

          print("🎙️ Generating Voiceover clips & calculating kinetic word frames...")
          for idx, scene in enumerate(data['scenes']):
              from gtts import gTTS
              from mutagen.mp3 import MP3

              text_content = scene['text']
              bg = tuple(scene['bg_color'])
              face_seq = scene['facial_sequence']
              words = text_content.split()
              
              tts = gTTS(text=text_content, lang='en', tld='co.uk', slow=False)
              audio_path = f"audio_clips/scene_{idx}.mp3"
              tts.save(audio_path)
              
              audio_length = MP3(audio_path).info.length
              total_scene_frames = int(audio_length * fps)
              audio_merge_list.append(audio_path)
              
              frames_per_word = max(1, total_scene_frames // len(words))
              
              for f in range(total_scene_frames):
                  img = Image.new('RGB', (width, height), color=bg)
                  draw = ImageDraw.Draw(img)
                  
                  # Character physics bounce calculations
                  bounce = int(math.sin(f * 0.3) * 12)
                  sway = int(math.cos(f * 0.2) * 8)
                  
                  # Render Classic Roblox Avatar Mesh Shapes
                  draw.rectangle([390 + sway, 660 + bounce, 690 + sway, 1050 + bounce], fill=(0, 120, 255)) # Torso
                  hx1, hy1, hx2, hy2 = 440 + sway, 430 + bounce, 640 + sway, 630 + bounce
                  draw.rectangle([hx1, hy1, hx2, hy2], fill=(255, 225, 120)) # Head
                  
                  # Animate Speaking Face Expressions
                  seq_index = min(int((f / total_scene_frames) * len(face_seq)), len(face_seq) - 1)
                  current_expression = face_seq[seq_index]
                  
                  eye_y, left_eye_x, right_eye_x = hy1 + 60, hx1 + 50, hx1 + 150
                  mouth_y, mouth_x = hy1 + 130, hx1 + 100
                  
                  if current_expression == "blink":
                      draw.line([left_eye_x - 15, eye_y, left_eye_x + 15, eye_y], fill=(0, 0, 0), width=6)
                      draw.line([right_eye_x - 15, eye_y, right_eye_x + 15, eye_y], fill=(0, 0, 0), width=6)
                  else:
                      draw.ellipse([left_eye_x - 15, eye_y - 20, left_eye_x + 15, eye_y + 10], fill=(0, 0, 0))
                      draw.ellipse([right_eye_x - 15, eye_y - 20, right_eye_x + 15, eye_y + 10], fill=(0, 0, 0))

                  if current_expression == "talk_open":
                      draw.ellipse([mouth_x - 25, mouth_y - 15, mouth_x + 25, mouth_y + 25], fill=(50, 0, 0))
                  elif current_expression == "talk_closed":
                      draw.line([mouth_x - 20, mouth_y, mouth_x + 20, mouth_y], fill=(0, 0, 0), width=6)
                  elif current_expression == "smile":
                      draw.arc([mouth_x - 25, mouth_y - 20, mouth_x + 25, mouth_y + 10], 0, 180, fill=(0, 0, 0), width=7)
                  elif current_expression == "shocked":
                      draw.ellipse([mouth_x - 35, mouth_y - 25, mouth_x + 35, mouth_y + 45], fill=(0, 0, 0))

                  # 3. Dynamic Word-by-Word Subtitle Highlight Overlay
                  active_word_idx = min(f // frames_per_word, len(words) - 1)
                  active_word = words[active_word_idx].upper()
                  
                  # Perfect Mobile & Desktop Shared Center Alignments
                  text_y = 1380
                  
                  # Get Text bounding coordinates to draw accurate thick outlines
                  try:
                      text_w = draw.textlength(active_word, font=font)
                  except:
                      text_w = len(active_word) * 50
                  text_x = (width - text_w) // 2
                  
                  # 4. Burn a high-contrast heavy dark text border outline effect
                  border_thickness = 8
                  for dx in range(-border_thickness, border_thickness + 1):
                      for dy in range(-border_thickness, border_thickness + 1):
                          if dx*dx + dy*dy <= border_thickness*border_thickness:
                              draw.text((text_x + dx, text_y + dy), active_word, font=font, fill=(0, 0, 0))
                  
                  # Draw core text layer over the border outline mapping (Neon Yellow)
                  draw.text((text_x, text_y), active_word, font=font, fill=(255, 255, 0))
                  
                  img.save(f"frames/frame_{frame_count:05d}.png")
                  frame_count += 1

          with open('audio_list.txt', 'w') as al:
              for path in audio_merge_list:
                  al.write(f"file '{path}'\n")

          print(f"📦 Staging complete. Total calculated pipeline video frames: {frame_count}")
          EOF
          python render_engine.py

      - name: Stitch Voice Tracks and Visual Timelines Together
        run: |
          ffmpeg -y -f concat -safe 0 -i audio_list.txt -c copy master_voiceover.mp3
          ffmpeg -y -framerate 30 -i frames/frame_%05d.png -c:v libx264 -crf 18 -pix_fmt yuv420p video_silent.mp4
          ffmpeg -y -i video_silent.mp4 -i master_voiceover.mp3 -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 roblox_shorts_final.mp4

      - name: Publish Finished Video Asset to GitHub Files
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Shorts-HD-Captions-Pack
          path: roblox_shorts_final.mp4
