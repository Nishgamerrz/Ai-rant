name: Generate 2K Vertical YouTube Short

on:
  workflow_dispatch:
    inputs:
      story_topic:
        description: 'Real-life story topic to animate in a Roblox-style 3D world'
        required: true
        default: 'A student finds a lost wallet on the way to school and has to choose what to do'
        type: string
      duration_seconds:
        description: 'Short duration in seconds'
        required: true
        default: '60'
        type: choice
        options:
          - '30'
          - '45'
          - '60'

env:
  AI_MODEL: qwen3:4b

permissions:
  contents: read

jobs:
  render_short:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Blender, FFmpeg, and narration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq zstd blender ffmpeg xvfb libgl1-mesa-dri fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts mutagen

      - name: Start local story and animation model
        run: |
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst -o ollama.tar.zst
          sudo tar -I zstd -xf ollama.tar.zst -C /usr
          ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$AI_MODEL"

      - name: Write a believable real-life story
        env:
          STORY_TOPIC: ${{ inputs.story_topic }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          MIN_WORDS=$((DURATION_SECONDS * 3 / 2))
          TARGET_WORDS=$((DURATION_SECONDS * 8 / 5))
          MAX_WORDS=$((DURATION_SECONDS * 5 / 3))
          if [ "$MAX_WORDS" -gt 100 ]; then MAX_WORDS=100; fi
          cat > narration_prompt.txt <<PROMPT
          Write ONE short, vivid, believable real-life mini-story in natural English for a ${DURATION_SECONDS}-second vertical short.
          Topic: "${STORY_TOPIC}". Aim for ${TARGET_WORDS} words, strictly between ${MIN_WORDS} and ${MAX_WORDS} words.
          HARD LIMIT: never write more than ${MAX_WORDS} words. This is a brief short, not a long story. Do not pad it.
          Use one everyday event, a quick hook, a clear choice, and a satisfying ending. Keep sentences concise and conversational.
          Do NOT mention AI, servers, Roblox, avatars, game mechanics, glitches, or that the story is generated.
          No stage directions, speaker labels, timestamps, sound effects, or artificial pauses.
          Return ONLY JSON: {"narration":"the complete spoken story"}.
          PROMPT
          jq -n --arg model "$AI_MODEL" --rawfile prompt narration_prompt.txt \
            '{model:$model, prompt:$prompt, format:{type:"object",properties:{narration:{type:"string"}},required:["narration"],additionalProperties:false}, think:false, stream:false, options:{temperature:0.35, num_predict:420}}' > narration_request.json
          mkdir -p dist
          curl --fail --silent --show-error --max-time 600 \
            http://127.0.0.1:11434/api/generate -d @narration_request.json -o narration_response.json
          for attempt in 1 2 3; do
            if python tools/prepare_narration.py narration_response.json dist/narration.txt "$DURATION_SECONDS"; then
              echo "Narration passed the ${MAX_WORDS}-word hard cap on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "AI still missed the limit; applying the automatic final short-story guard."
              python tools/prepare_narration.py narration_response.json dist/narration.txt "$DURATION_SECONDS" --truncate "$STORY_TOPIC"
              break
            fi
            DRAFT=$(jq -r '.response // ""' narration_response.json)
            jq -n --arg model "$AI_MODEL" --arg draft "$DRAFT" \
              --arg topic "$STORY_TOPIC" --arg duration "$DURATION_SECONDS" \
              --arg min "$MIN_WORDS" --arg max "$MAX_WORDS" --arg target "$TARGET_WORDS" \
              '{model:$model, format:{type:"object",properties:{narration:{type:"string"}},required:["narration"],additionalProperties:false}, think:false, stream:false, options:{temperature:0.25, num_predict:420}, prompt:("SHORTEN and rewrite the previous draft into one polished real-life story about: " + $topic + ". It must fit a " + $duration + "-second short. Aim for " + $target + " words and stay between " + $min + " and " + $max + " words. ABSOLUTE MAXIMUM: " + $max + " words; never go over it. If needed, remove details rather than adding words. Do not mention AI, servers, Roblox, avatars, game mechanics, or that it is generated. Return only JSON with a narration field. Previous draft to shorten, not expand: " + $draft)}' \
              > narration_repair_request.json
            curl --fail --silent --show-error --max-time 600 \
              http://127.0.0.1:11434/api/generate -d @narration_repair_request.json -o narration_response.json
          done
          test -s dist/narration.txt

      - name: Plan animated character movement
        env:
          STORY_TOPIC: ${{ inputs.story_topic }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          NARRATION=$(cat dist/narration.txt)
          cat > animation_prompt.txt <<PROMPT
          Create keyframes for the blocky 3D character acting out this real-life story: "${STORY_TOPIC}"
          Spoken narration: "${NARRATION}"
          Required animation duration: ${DURATION_SECONDS} seconds. Return ONLY valid JSON:
          {"name":"ShortAnimation","keyframes":[{"time":0,"face":"talk","poses":{"Head":[0,0,0],"UpperTorso":[0,0,0],"RightUpperArm":[0,0,0]}}]}
          Every keyframe must also set face to one of: neutral, talk, smile, shocked, blink.
          Plan clear story beats, then make 24 to 42 keyframes distributed through the FULL runtime, starting at 0 and ending
          close to ${DURATION_SECONDS}. Use seconds for time. Pose arrays are [rotationX,rotationY,rotationZ]
          in degrees, relative to the neutral R15 pose; keep each angle between -100 and 100.
          Poses are sparse: include only joints that move in that keyframe; omitted joints are neutral.
          Allowed joint names: HumanoidRootPart, LowerTorso, UpperTorso, Head, LeftUpperArm,
          LeftLowerArm, LeftHand, RightUpperArm, RightLowerArm, RightHand, LeftUpperLeg,
          LeftLowerLeg, LeftFoot, RightUpperLeg, RightLowerLeg, RightFoot.
          Animate natural speaking gestures and story reactions that change over time. Alternate gestures, avoid holding
          one pose for long, keep the avatar in place, and end relaxed. This is motion data only; no dialog about AI,
          servers, or game mechanics, and no scene layout, images, video, or subtitles.
          PROMPT
          jq -n --arg model "$AI_MODEL" --rawfile prompt animation_prompt.txt \
            '{model:$model, prompt:$prompt, format:"json", think:false, stream:false, options:{temperature:0.55, num_predict:3000}}' > animation_request.json
          curl --fail --silent --show-error --max-time 900 \
            http://127.0.0.1:11434/api/generate -d @animation_request.json -o animation_response.json
          jq -r '.response // empty' animation_response.json > ai_animation.json
          python tools/build_roblox_animation.py ai_animation.json dist/Roblox_R15_Animation.json "$DURATION_SECONDS" --json-only

      - name: Design the 3D story setting and AI-directed camera plan
        env:
          STORY_TOPIC: ${{ inputs.story_topic }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          NARRATION=$(cat dist/narration.txt)
          cat > map_prompt.txt <<PROMPT
          Design a polished, colorful 3D Roblox-style set that visually supports this believable real-life short story.
          Story/topic: "${STORY_TOPIC}"
          Story narration: "${NARRATION}"
          Plan cinematic camera moves and cuts across ${DURATION_SECONDS} seconds. Return ONLY valid JSON with this structure:
          {"name":"Neighborhood Street","theme":"A clear environment description","ground_color":[38,48,68],"ambient_color":[140,160,200],"props":[{"name":"Corner Shop","shape":"Block","material":"Brick","position":[-35,8,10],"size":[24,16,20],"color":[30,210,240]}],"camera_shots":[{"time":0,"position":[0,30,76],"target":[0,3,24],"transition":"smooth"},{"time":${DURATION_SECONDS},"position":[-22,13,34],"target":[0,3,24],"transition":"snap"}]}
          Use 5 to 8 camera_shots with increasing times from 0 through ${DURATION_SECONDS}; vary positions and targets to show the map and character.
          Coordinates are Roblox X,Y,Z (Y is height). Aim close shots near [0,3,24], begin wide, finish on the avatar.
          Use 2 wide views about 45-65 studs away and 2 close views about 10-18 studs away; mix smooth cinematic moves with 2-3 deliberate snap cuts.
          Keep the avatar in frame and avoid clipping through props or moving chaotically.
          Include 12 to 24 visually varied story-specific props: buildings/landmarks, foreground dressing, and colorful accents.
          Leave the center and central avenue open for the character. This is a 3D world layout, not an image or 2D drawing.
          Every prop must have a distinct short name, shape Block/Ball/Cylinder, material only from Plastic, SmoothPlastic, Concrete,
          Grass, Slate, Wood, Metal, Neon, Glass, Brick, Asphalt, position as three numbers from -85 to 85, size as three numbers
          from 0.5 to 60, and RGB color as three integers from 0 to 255. Keep it appropriate for all ages.
          PROMPT
          jq -n --arg model "$AI_MODEL" --rawfile prompt map_prompt.txt \
            '{model:$model, prompt:$prompt, format:"json", think:false, stream:false, options:{temperature:0.65, num_predict:3000}}' > map_request.json
          curl --fail --silent --show-error --max-time 600 \
            http://127.0.0.1:11434/api/generate -d @map_request.json -o map_response.json
          python tools/build_story_map.py map_response.json dist/Roblox_Story_Map.json "$DURATION_SECONDS" --json-only

      - name: Synthesize brisk, clear male narration and readable captions
        env:
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          edge-tts --voice en-US-GuyNeural --rate=+10% \
            --file dist/narration.txt --write-media dist/narration.mp3 \
            --write-subtitles dist/narration.srt
          test -s dist/narration.srt
          python - <<'PY'
          from mutagen.mp3 import MP3
          path = 'dist/narration.mp3'
          seconds = MP3(path).info.length
          import os
          maximum = int(os.environ['DURATION_SECONDS']) + 1
          print(f'Male voiceover duration: {seconds:.1f} seconds (short limit {maximum}s)')
          if not 5 <= seconds <= maximum:
              raise SystemExit('Voiceover duration is empty or exceeds the selected short length.')
          PY

      - name: Generate timed sound effects for story and camera beats
        run: |
          python tools/create_sound_bed.py dist/Roblox_Story_Map.json \
            "${{ inputs.duration_seconds }}" /tmp/short-sound-bed.wav

      - name: Render the final captioned vertical 2K MP4
        env:
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          mkdir -p dist /tmp/blender-config
          BLENDER_USER_CONFIG=/tmp/blender-config xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            blender -b --threads 4 --python tools/render_short.py -- \
            --animation dist/Roblox_R15_Animation.json \
            --map dist/Roblox_Story_Map.json \
            --duration "$DURATION_SECONDS" \
            --output "$PWD/dist/short_silent.mp4" \
            --width 1440 --height 2560 --fps 30
          ffmpeg -hide_banner -y -i dist/short_silent.mp4 -i dist/narration.mp3 -i /tmp/short-sound-bed.wav \
            -vf "subtitles=dist/narration.srt:force_style='FontName=DejaVu Sans,FontSize=64,Bold=1,PrimaryColour=&H00FFFFFF,OutlineColour=&H00111111,BorderStyle=1,Outline=5,Shadow=1,MarginL=120,MarginR=120,MarginV=300,Alignment=2'" \
            -filter_complex "[1:a]volume=1.0[voice];[2:a]volume=0.38[effects];[voice][effects]amix=inputs=2:duration=longest:dropout_transition=0,loudnorm=I=-16:TP=-1.5:LRA=11[mix]" \
            -map 0:v:0 -map '[mix]' -c:v libx264 -preset fast -crf 20 \
            -pix_fmt yuv420p -r 30 -c:a aac -b:a 192k -shortest \
            -movflags +faststart dist/Roblox_2K_YouTube_Short.mp4
          python - <<'PY'
          import json, subprocess
          path = 'dist/Roblox_2K_YouTube_Short.mp4'
          info = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error', '-show_streams', '-show_format', '-of', 'json', path
          ], text=True))
          video = next(s for s in info['streams'] if s['codec_type'] == 'video')
          audio = next(s for s in info['streams'] if s['codec_type'] == 'audio')
          seconds = float(info['format']['duration'])
          print(f"Verified final MP4: {video['width']}x{video['height']} {video['avg_frame_rate']} fps, {seconds:.1f}s, {audio['codec_name']} audio")
          expected = int(__import__('os').environ['DURATION_SECONDS'])
          if (video['width'], video['height']) != (1440, 2560) or audio['codec_name'] != 'aac' or not expected - 2 <= seconds <= expected + 2:
              raise SystemExit('Final MP4 failed vertical 2K, AAC audio, or selected-duration validation.')
          PY

      - name: Upload only the finished YouTube Short MP4
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-2K-YouTube-Short
          path: dist/Roblox_2K_YouTube_Short.mp4
          if-no-files-found: error
          retention-days: 14
