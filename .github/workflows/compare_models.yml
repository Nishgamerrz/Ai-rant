# One button, two full runs: the same story, world and theme generated by the
# `hard` preset (qwen3:8b with the long thinking budget) and by `smart_11b`
# (qwen3:14b), side by side, at the world detail you pick. Both calls are the
# real generator in main.yml - nothing is duplicated or simplified here - and
# each run keeps its own still previews because the artifact and preview branch
# are named after the model preset.
name: 'Compare AI models on one story (hard vs smart_11b)'

on:
  workflow_dispatch:
    inputs:
      story_topic:
        description: 'Story topic — one line, "In a world where ..." works best'
        required: true
        default: 'In a world where the town clock runs ten minutes fast for everyone but one girl, she is late to the one thing that matters'
        type: string
      world_theme:
        description: 'World theme the AI must build (optional, but a good one helps)'
        required: false
        default: 'a sunlit hillside town with a stone clock tower, terracotta rooftops, striped market awnings, hanging laundry and warm cobbled streets'
        type: string
      character_usernames:
        description: 'Usernames, COMMA separated (e.g. normal, noob). First = lead.'
        required: true
        default: 'normal, noob'
        type: string
      duration_seconds:
        description: 'Length — both runs use exactly this minute'
        required: true
        default: '120'
        type: choice
        options:
          - '30'
          - '45'
          - '60'
          - '90'
          - '120'
          - '150'
          - '180'
      map_detail:
        description: 'World size — ultra is 5000 furnished Parts'
        required: true
        default: ultra
        type: choice
        options:
          - standard
          - dense
          - ultra
      voice_style:
        description: 'Voice (both runs match, so only the world and story differ)'
        required: true
        default: male
        type: choice
        options:
          - male
          - female
          - thin_male

permissions:
  contents: write

jobs:
  hard:
    name: 'hard (qwen3:8b, long thinking)'
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      story_topic: ${{ inputs.story_topic }}
      character_usernames: ${{ inputs.character_usernames }}
      duration_seconds: ${{ inputs.duration_seconds }}
      map_detail: ${{ inputs.map_detail }}
      model_quality: hard
      voice_style: ${{ inputs.voice_style }}
      world_theme: ${{ inputs.world_theme }}

  smart_11b:
    name: 'smart_11b (qwen3:14b)'
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      story_topic: ${{ inputs.story_topic }}
      character_usernames: ${{ inputs.character_usernames }}
      duration_seconds: ${{ inputs.duration_seconds }}
      map_detail: ${{ inputs.map_detail }}
      model_quality: smart_11b
      voice_style: ${{ inputs.voice_style }}
      world_theme: ${{ inputs.world_theme }}
